[project]
name = "emojic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightning>=2.6.5",
    "numpy>=2.4.6",
    "tensorboard>=2.21.0",
    'torch',
    "tqdm>=4.70.0",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "modal>=1.5.5",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py311"
line-length = 93

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
