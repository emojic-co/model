[project]
name = "emojic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightning>=2.6.5",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    'torch',
    "tqdm>=4.70.0",
    "typer>=0.27.2",
]

[project.scripts]
train = "train:_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["train.py", "config.py", "data.py", "model.py", "runmeta.py"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "modal>=1.5.5",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py313"
line-length = 93

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tools/report.py" = ["E402"]
