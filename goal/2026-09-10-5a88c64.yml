meta:
  based_on: docs/step1-keyword-search.md
  written_after_report: null
  rationale: >
    Step 1 - smallest footprint that proves keyword search. Curated ~150-emoji
    vocab, ~250-300 CLDR keywords, small char-CNN (ENCODER_CHANNELS [64, 96],
    dilation [1, 2], MAX_TEXT_LEN 32), emoji + fusion heads only. Colour palette
    and style are out of scope; Vocab Coverage / Diversity are deliberately low
    (lowest priority) and not gated this iteration.
  deferred:
    - colors
    - coverage

goals:
  keyword:
    exact:
      acc@1: 0.95
    fuzzy:
      acc@1: 0.90
      acc@5: 0.95
  text:
    acc@1: 0.70
    acc@5: 0.85
    acc@10: 0.90
