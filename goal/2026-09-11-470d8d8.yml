meta:
  based_on: docs/step1-keyword-search.md
  written_after_report: report/26-09-11-00-21-992cabb
  rationale: >
    Iteration 1 — the milestone-1 keyword path is validated. Priority 1 is the
    fusion model's Acc@1 on exact CLDR keywords (report.json
    keyword.fusion.acc_at_k[0]) = 0.680 — the standalone inverted-index search
    (keyword.exact.acc_at_k[0] = 0.966) already clears 0.95, so the whole gap is
    the combiner dragging the clean kw ranking down with model noise; combiner
    routing is recommend-only. Priority 2 is full-text emoji Acc@1 (emoji.eval,
    best fusion variant = Fusion.Gain, 0.538). Sub-signal: model-only CLDR Acc@1
    (0.312 — the encoder has not learned bare keyword->emoji, expected for
    milestone 1).
  deferred:
    - "emoji prediction.exact keyword.acc@5"
    - "emoji prediction.exact keyword.acc@10"
    - "emoji prediction.fuzzy keyword"
    - "emoji prediction.full text.acc@5"
    - "emoji prediction.full text.acc@10"
    - style prediction
    - color generator
    - max text len
    - vocabulary

goals:
  emoji prediction:
    exact keyword:
      "acc@1": 0.72
    full text:
      "acc@1": 0.58
