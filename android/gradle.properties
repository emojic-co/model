org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.0 defaults this to true, which replaces the standalone
# org.jetbrains.kotlin.android plugin. Kept off since this module still
# applies kotlin.plugin.compose/kotlin.plugin.serialization alongside it —
# revisit as part of a dedicated built-in-Kotlin migration.
android.builtInKotlin=false

# AGP 9.0's new-DSL default breaks org.jetbrains.kotlin.android's plugin
# application (casts the new ApplicationExtensionImpl to the old
# BaseExtension and fails) — same built-in-Kotlin migration removes the need
# for this too. Both flags are removed in AGP 10.0.
android.newDsl=false
