<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animation frames</title>
<style>
:root{--ink:#1b1f24;--dim:#656b73;--line:#e2e5e9;--panel:#f5f6f8;--bg:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#e8eaed;--dim:#9aa0a6;--line:#2c3036;--panel:#1c1f24;--bg:#121417}}
*{box-sizing:border-box}body{font:14px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:24px}
h2{margin:24px 0 12px}h2 small{color:var(--dim);font-weight:400;font-size:13px}
.row{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.loop{position:sticky;top:12px;width:200px;text-align:center}.loop img{width:200px;height:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.loop label{color:var(--dim);font-size:12px}.fps{width:52px}
.grid{flex:1;min-width:300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
figure img,.missing{width:100%;aspect-ratio:1;display:block}.missing{display:grid;place-items:center;color:var(--dim)}
figcaption{font-size:11px;color:var(--dim);margin-top:4px}figcaption b{color:var(--ink)}
</style></head><body>
<section data-stem="1f514"><h2>🔔 <small>1f514</small></h2>
<div class="row"><div class="loop"><img class="live" src="svg/1f514/frame_01.svg" alt=""><label>fps <input type="number" class="fps" value="12" min="1" max="60"></label></div>
<div class="grid"><figure><img src="svg/1f514/frame_01.svg" alt=""><figcaption><b>1</b> The bell rests upright with its golden body, top loop, dark clapper, and brown base exactly as drawn.</figcaption></figure><figure><img src="svg/1f514/frame_02.svg" alt=""><figcaption><b>2</b> The bell tilts 2 degrees to the right while the clapper shifts 1 unit left.</figcaption></figure><figure><img src="svg/1f514/frame_03.svg" alt=""><figcaption><b>3</b> The bell tilts 4 degrees to the right and the clapper shifts 2 units left.</figcaption></figure><figure><img src="svg/1f514/frame_04.svg" alt=""><figcaption><b>4</b> The bell tilts 6 degrees to the right, with the clapper hanging 3 units left of center.</figcaption></figure><figure><img src="svg/1f514/frame_05.svg" alt=""><figcaption><b>5</b> The bell reaches an 8-degree right tilt, its clapper pulled 4 units left, with two tiny sound lines near the right rim.</figcaption></figure><figure><img src="svg/1f514/frame_06.svg" alt=""><figcaption><b>6</b> The bell eases back to a 7-degree right tilt as the clapper moves 3 units left and the sound lines fade slightly.</figcaption></figure><figure><img src="svg/1f514/frame_07.svg" alt=""><figcaption><b>7</b> The bell tilts 5 degrees right, with the clapper 2 units left and one faint sound line at the right rim.</figcaption></figure><figure><img src="svg/1f514/frame_08.svg" alt=""><figcaption><b>8</b> The bell tilts 3 degrees right, with the clapper 1 unit left and no visible sound lines.</figcaption></figure><figure><img src="svg/1f514/frame_09.svg" alt=""><figcaption><b>9</b> The bell tilts 1 degree right as the clapper returns nearly to the center.</figcaption></figure><figure><img src="svg/1f514/frame_10.svg" alt=""><figcaption><b>10</b> The bell passes upright and tilts 1 degree left, with the clapper 1 unit right.</figcaption></figure><figure><img src="svg/1f514/frame_11.svg" alt=""><figcaption><b>11</b> The bell tilts 3 degrees left, with the clapper 2 units right and one faint sound line near the left rim.</figcaption></figure><figure><img src="svg/1f514/frame_12.svg" alt=""><figcaption><b>12</b> The bell tilts 5 degrees left, with the clapper 3 units right and two tiny sound lines near the left rim.</figcaption></figure><figure><img src="svg/1f514/frame_13.svg" alt=""><figcaption><b>13</b> The bell reaches an 7-degree left tilt, with the clapper 4 units right and the left sound lines slightly brighter.</figcaption></figure><figure><img src="svg/1f514/frame_14.svg" alt=""><figcaption><b>14</b> The bell reaches its maximum 8-degree left tilt, with the clapper 4 units right and two clear sound lines beside the left rim.</figcaption></figure><figure><img src="svg/1f514/frame_15.svg" alt=""><figcaption><b>15</b> The bell eases back to a 7-degree left tilt as the clapper moves 3 units right and the sound lines soften.</figcaption></figure><figure><img src="svg/1f514/frame_16.svg" alt=""><figcaption><b>16</b> The bell tilts 5 degrees left, with the clapper 2 units right and one faint sound line remaining.</figcaption></figure><figure><img src="svg/1f514/frame_17.svg" alt=""><figcaption><b>17</b> The bell tilts 3 degrees left, with the clapper 1 unit right and no visible sound lines.</figcaption></figure><figure><img src="svg/1f514/frame_18.svg" alt=""><figcaption><b>18</b> The bell tilts 2 degrees left as the clapper settles almost beneath the center.</figcaption></figure><figure><img src="svg/1f514/frame_19.svg" alt=""><figcaption><b>19</b> The bell tilts 1 degree left, with the clapper just 1 unit right of center.</figcaption></figure><figure><img src="svg/1f514/frame_20.svg" alt=""><figcaption><b>20</b> The bell is 1 degree left of upright, with the clapper 1 unit right, poised to return to the resting pose.</figcaption></figure></div></div></section>
<script>
for (const s of document.querySelectorAll('section')) {
  const frames = [...s.querySelectorAll('figure img')].map(i => i.getAttribute('src')), live = s.querySelector('.live'), fps = s.querySelector('.fps')
  let k = 0, t
  const run = () => { clearInterval(t); t = setInterval(() => { k = (k + 1) % frames.length; live.src = frames[k] }, 1000 / Math.max(1, +fps.value || 12)) }
  fps.onchange = run; if (frames.length) run()
}
</script></body></html>
