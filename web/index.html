<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>emojic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Fredoka:wght@500;600&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,600&family=Quicksand:wght@500;600&family=Shantell+Sans:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>emojic</h1>
    <input
      id="input"
      type="text"
      autocomplete="off"
      autofocus
      placeholder="type something…"
      maxlength="32"
    />

    <div id="card">
      <span id="emoji">🙂</span>
      <p id="typed"></p>
      <span id="feeling">—</span>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
