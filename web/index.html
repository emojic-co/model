<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>emojic</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>emojic</h1>
    <input
      id="input"
      type="text"
      autocomplete="off"
      autofocus
      placeholder="type something…"
      maxlength="64"
    />

    <div id="card">
      <span id="emoji">🙂</span>
      <p id="typed"></p>
      <span id="feeling">—</span>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
