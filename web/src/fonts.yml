# Single source of truth for every font the web and Android apps render.
# Web builds CSS stacks + Google Fonts queries from this; export-style copies it into style.yml for Android.

fallback: {family: Noto Sans, generic: sans-serif}

latin:
  Joyful: {family: Fredoka, generic: sans-serif}
  Excited: {family: Chewy, generic: sans-serif}
  Hopeful: {family: Poppins, generic: sans-serif}
  Serene: {family: Quicksand, generic: sans-serif}
  Tender: {family: Caveat, generic: cursive}
  Playful: {family: Bungee, generic: sans-serif}
  Whimsical: {family: Gochi Hand, generic: cursive}
  Awed: {family: Luckiest Guy, generic: sans-serif}
  Earnest: {family: Shadows Into Light, generic: cursive}
  Determined: {family: Barlow Condensed, generic: sans-serif}
  Proud: {family: Rubik, generic: sans-serif}
  Wistful: {family: Spectral, generic: serif}
  Melancholy: {family: Playfair Display, generic: serif}
  Anxious: {family: Shantell Sans, generic: sans-serif}
  Tense: {family: Oswald, generic: sans-serif}
  Furious: {family: Anton, generic: sans-serif}
  Irritated: {family: Archivo Black, generic: sans-serif}
  Disgusted: {family: Griffy, generic: cursive}
  Startled: {family: Schoolbell, generic: cursive}
  Sarcastic: {family: Bitter, generic: serif}
  Deadpan: {family: Inter, generic: sans-serif}
  Neutral: {family: Work Sans, generic: sans-serif}
scripts:
  hebrew:
    anger: {family: Suez One, generic: serif}
    joy: {family: Varela Round, generic: sans-serif}
    play: {family: Gveret Levin, generic: cursive}
    calm: {family: M PLUS Rounded 1c, generic: sans-serif, weight: 400}
    tender: {family: Secular One, generic: sans-serif}
    drive: {family: Miriam Libre, generic: sans-serif, weight: 700}
    sad: {family: Frank Ruhl Libre, generic: serif, weight: 300}
    anxiety: {family: Amatic SC, generic: cursive, weight: 400}
    reflective: {family: Heebo, generic: sans-serif, weight: 400}
