# GROUND TRUTH for the shared preview/export clip. Web (web/src/clip.js) reads this directly;
# tools/data/export-style.ts copies it verbatim into style.yml under `clip` for Android.
# Edit here, then `bun run export-style`.
#
# Semantics (both platforms must follow exactly):
#  * Clip time t runs 0..L. Text entrance and emoji start together at t=0 (the text is animated once, no
#    poster frame first); the shimmer starts at entranceTotal + shimmers.startDelayMs and runs one pass (no
#    repeat); the emoji Lottie plays once (loopMs), then rests at its first frame.
#  * content = entranceTotal + startDelayMs + shimmerPass. The clip stops when both the emoji and the shimmer
#    are done: L = max(content, min(loopMs, maxClipMs)); a long emoji is cut at maxClipMs, the entrance and
#    shimmer pass never are. This can be well under 6 s.
#  * GIF budget: maxClipMs = 6000 ms, so an exported GIF is at most 6 s (entrance <= 2000 and shimmer
#    <= 2500 keep content = 4750 <= maxClipMs).
#  * Emoji without a Lottie clone (loopMs = 0): L = content and the emoji plays the spring once from t=0
#    (scale(t), see `spring`), then rests at scale 1.
#  * spring: scale(t) = 1 - (1 - from) * exp(-zeta*omega*t) * (cos(wd*t) + zeta*omega/wd * sin(wd*t)),
#    t in seconds, wd = omega * sqrt(1 - zeta^2); scale = 1 for t >= durationMs.
#  * Export: the clip samples t = i * 1000 / fps for i = 0 until ceil(L * fps / 1000), at gifFps (GIF) or
#    mp4Fps (MP4). The preview loops the clip.
#  * MP4 only: the last frame is held mp4EndHoldMs before the video loops.
maxClipMs: 6000
gifFps: 12
mp4Fps: 20
mp4EndHoldMs: 3000
spring:
  durationMs: 900
  from: 0.88
  zeta: 0.4
  omega: 14
