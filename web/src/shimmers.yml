# GROUND TRUTH for the background shimmer effects (one effect per style cluster).
# Web (web/src/shimmer.js) plays this directly; tools/data/export-style.ts copies it verbatim into
# style.yml under `shimmer` so Android renders from the same numbers.
# Edit here, then `bun run export-style`. Nothing else may hard-code shimmer values.
#
# Semantics (both platforms must follow exactly):
#  * The shimmer is an overlay drawn ABOVE the card's gradient + pattern and BELOW the emoji and text.
#    It is clipped to the card. Card space is normalized: x, y in 0..1 (square card).
#  * Start: `startDelayMs` after the text entrance has fully finished (entrance total = last unit's
#    delay + durationMs, see textAnimations.yml). Every replay of the entrance restarts the shimmer.
#    Before the start, and with reduced-motion, nothing is drawn.
#  * No pass (durationMs, including style overrides) may exceed 3000 ms (enforced by shimmer.test.js).
#  * One pass only, never repeated: with t = time since the start, u = t / durationMs. While 0 <= u < 1
#    the effect is drawn at pass progress u; from u >= 1 on nothing is drawn.
#  * Keyframes: `at` in 0..1 over the pass; fields opacity (0..1) and c (a kind-specific number).
#    Missing fields carry from the previous keyframe. Between two keyframes the local progress is
#    eased with the cubic-bezier `easing` (same easing for every segment) and c/opacity are lerped.
#    Overall alpha of the drawn layer = opacity * (colour alpha).
#  * Colours are #RRGGBBAA. Gradient stops interpolate linearly in premultiplied-free RGBA per channel.
#  * `blend`: normal | screen | overlay | softLight | multiply (CSS mix-blend-mode / Android BlendMode).
#  * kind sweep: a linear band travelling along angleDeg (0 = left->right, 90 = top->bottom).
#      s(p) = ((p - (0.5, 0.5)) . (cos a, sin a)) / (|cos a| + |sin a|) + 0.5 maps every card point to 0..1
#      along the axis. c = band centre in s. Band spans c +/- widthFrac/2; colour at s is
#      stops(((s - c) / widthFrac) + 0.5) (stop `at` in 0..1 across the band), and transparent outside it.
#  * kind radial: a circular glow centred at (cx, cy) with radius = c * radiusFrac * cardWidth.
#      Stop `at` runs 0 (centre) .. 1 (edge); transparent outside.
#  * kind flash: the whole card filled with a linear gradient along angleDeg (same s mapping, stop `at`
#      = s). c is unused; only opacity animates (use it for irregular flicker).
#  * `styles.<Name>` overrides on top of the cluster effect: durationMs, angleDeg.

startDelayMs: 250

clusters:
  anger:
    kind: sweep
    angleDeg: 20
    widthFrac: 0.18
    blend: screen
    durationMs: 650
    easing: [0.6, 0, 0.4, 1]
    stops:
      - { at: 0, color: "#FF3B0000" }
      - { at: 0.45, color: "#FF8A3DCC" }
      - { at: 0.5, color: "#FFF2D6F0" }
      - { at: 0.55, color: "#FF8A3DCC" }
      - { at: 1, color: "#FF3B0000" }
    keyframes:
      - { at: 0, c: -0.15, opacity: 1 }
      - { at: 1, c: 1.15, opacity: 1 }
  joy:
    kind: sweep
    angleDeg: 30
    widthFrac: 0.45
    blend: screen
    durationMs: 1400
    easing: [0.4, 0, 0.2, 1]
    stops:
      - { at: 0, color: "#FFE08A00" }
      - { at: 0.5, color: "#FFF6CCB3" }
      - { at: 1, color: "#FFE08A00" }
    keyframes:
      - { at: 0, c: -0.25, opacity: 1 }
      - { at: 1, c: 1.25, opacity: 1 }
  play:
    kind: sweep
    angleDeg: -25
    widthFrac: 0.9
    blend: screen
    durationMs: 2400
    easing: [0.4, 0, 0.6, 1]
    stops:
      - { at: 0, color: "#FF4D6D00" }
      - { at: 0.17, color: "#FF4D6D66" }
      - { at: 0.34, color: "#FFD93D66" }
      - { at: 0.5, color: "#4DFF9166" }
      - { at: 0.66, color: "#4DD2FF66" }
      - { at: 0.83, color: "#7A5CFF66" }
      - { at: 1, color: "#FF5CE600" }
    keyframes:
      - { at: 0, c: -0.5, opacity: 1 }
      - { at: 1, c: 1.5, opacity: 1 }
  calm:
    kind: sweep
    angleDeg: 45
    widthFrac: 0.7
    blend: screen
    durationMs: 3000
    easing: [0.45, 0, 0.55, 1]
    stops:
      - { at: 0, color: "#FFFFFF00" }
      - { at: 0.5, color: "#FFFFFF44" }
      - { at: 1, color: "#FFFFFF00" }
    keyframes:
      - { at: 0, c: -0.4, opacity: 1 }
      - { at: 1, c: 1.4, opacity: 1 }
  sad:
    kind: sweep
    angleDeg: 90
    widthFrac: 0.5
    blend: multiply
    durationMs: 3000
    easing: [0.3, 0, 0.7, 1]
    stops:
      - { at: 0, color: "#3A4A6600" }
      - { at: 0.5, color: "#3A4A6655" }
      - { at: 1, color: "#3A4A6600" }
    keyframes:
      - { at: 0, c: -0.3, opacity: 1 }
      - { at: 1, c: 1.3, opacity: 1 }
  anxiety:
    kind: flash
    angleDeg: 90
    blend: screen
    durationMs: 1400
    easing: [0, 0, 1, 1]
    stops:
      - { at: 0, color: "#FFFFFF66" }
      - { at: 1, color: "#FFFFFF00" }
    keyframes:
      - { at: 0, opacity: 0 }
      - { at: 0.06, opacity: 0.9 }
      - { at: 0.1, opacity: 0.1 }
      - { at: 0.18, opacity: 0.7 }
      - { at: 0.22, opacity: 0 }
      - { at: 0.5, opacity: 0 }
      - { at: 0.54, opacity: 0.6 }
      - { at: 0.58, opacity: 0.05 }
      - { at: 0.62, opacity: 0.8 }
      - { at: 0.7, opacity: 0 }
      - { at: 1, opacity: 0 }
  tender:
    kind: radial
    cx: 0.5
    cy: 0.42
    radiusFrac: 0.6
    blend: screen
    durationMs: 2600
    easing: [0.4, 0, 0.6, 1]
    stops:
      - { at: 0, color: "#FFB3D1AA" }
      - { at: 0.6, color: "#FF8FB955" }
      - { at: 1, color: "#FF8FB900" }
    keyframes:
      - { at: 0, c: 0.35, opacity: 0 }
      - { at: 0.5, c: 1, opacity: 1 }
      - { at: 1, c: 1.25, opacity: 0 }
  drive:
    kind: sweep
    angleDeg: 15
    widthFrac: 0.12
    blend: screen
    durationMs: 900
    easing: [0.4, 0, 0.2, 1]
    stops:
      - { at: 0, color: "#FFFFFF00" }
      - { at: 0.35, color: "#FFFFFF55" }
      - { at: 0.5, color: "#FFFFFFCC" }
      - { at: 0.65, color: "#FFFFFF55" }
      - { at: 1, color: "#FFFFFF00" }
    keyframes:
      - { at: 0, c: -0.2, opacity: 1 }
      - { at: 1, c: 1.2, opacity: 1 }
  reflective:
    kind: sweep
    angleDeg: 35
    widthFrac: 0.08
    blend: screen
    durationMs: 2200
    easing: [0.4, 0, 0.2, 1]
    stops:
      - { at: 0, color: "#FFFFFF00" }
      - { at: 0.5, color: "#FFFFFF66" }
      - { at: 1, color: "#FFFFFF00" }
    keyframes:
      - { at: 0, c: -0.15, opacity: 1 }
      - { at: 1, c: 1.15, opacity: 1 }

styles:
  Furious: { durationMs: 480 }
  Excited: { durationMs: 1000 }
  Tense: { durationMs: 1100 }
