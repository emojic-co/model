<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; }
  .og {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background-image:
      url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Cg%20fill='%23ffffff'%20fill-opacity='0.18'%3E%3Ccircle%20cx='20'%20cy='20'%20r='1.6'/%3E%3Ccircle%20cx='0'%20cy='0'%20r='1.6'/%3E%3Ccircle%20cx='40'%20cy='0'%20r='1.6'/%3E%3Ccircle%20cx='0'%20cy='40'%20r='1.6'/%3E%3Ccircle%20cx='40'%20cy='40'%20r='1.6'/%3E%3C/g%3E%3C/svg%3E"),
      linear-gradient(135deg, #ffd571, #ffad22);
    font: 600 34px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .emoji {
    font-family: "Noto Color Emoji", sans-serif;
    font-size: 340px;
    line-height: 1;
    filter: drop-shadow(0 18px 30px rgba(90, 48, 0, 0.28));
  }
  .word {
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: #2f1100;
  }
  .word .tld { opacity: 0.5; }
</style>
</head>
<body>
  <div class="og">
    <div class="emoji">🙂</div>
    <div class="word">emojify<span class="tld">.ing</span></div>
  </div>
</body>
</html>
