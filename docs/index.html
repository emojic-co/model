<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>emojic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Fredoka:wght@500;600&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@1,600&family=Quicksand:wght@500;600&family=Shantell+Sans:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <h1>emojic</h1>
    <input
      id="input"
      type="text"
      autocomplete="off"
      autofocus
      placeholder="type something…"
      maxlength="64"
    />

    <div id="card">
      <span id="emoji">🙂</span>
      <p id="typed"></p>
      <span id="feeling">—</span>
      <button id="copy" type="button" aria-label="Copy card as image">copy</button>
    </div>

    <div id="feelings" aria-label="feeling palette"></div>
  </main>

  <aside id="debug" aria-label="model debug info">
    <h2>feeling</h2>
    <ul id="dbg-feelings"></ul>
    <h2>top 10 emoji</h2>
    <ul id="dbg-emojis"></ul>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/ort.wasm.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
