name: Deploy Pages

# Rebuilds and publishes the standalone site whenever the model or anything the
# page is built from changes on main. Can also be run by hand from the Actions
# tab (workflow_dispatch). Repo Settings -> Pages -> Source must be "GitHub
# Actions".
on:
  push:
    branches: [main]
    paths:
      - model.pt
      - main.py
      - config.py
      - labels.json
      - build_web.py
      - site/**
      - web/style.css
      - vendor/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; don't pile up concurrent ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
