name: Deploy Pages

# Publishes the committed static site in docs/ whenever it changes on main.
# There is no build step -- docs/ is served exactly as committed (regenerate its
# model.onnx / meta.json locally with `uv run main.py`). Can also be run by hand
# from the Actions tab. Repo Settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; don't pile up concurrent ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
