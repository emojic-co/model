# Global project goals — the single, long-term statement of what emojic aims at.
# Dynamic: re-tune values here as priorities shift. tools/report.py reads this
# for every scorecard target — the only target source in the project.

goals:
  emoji prediction:
    keyword:
      "acc@1": 0.97
      "acc@5": 0.98
      "acc@10": 0.99
    term:
      "acc@1": 0.8
      "acc@5": 0.85
      "acc@10": 0.9
    full text:
      "acc@1": 0.65
      "acc@5": 0.75
      "acc@10": 0.9
    # flags:
    #   "acc@1": 0.9
    #   "acc@5": 0.95
    #   "acc@10": 0.99

  style prediction:
    full text:
      "acc@1": 0.60
      "acc@5": 0.80
      "acc@10": 0.87

  color generator:
    energy distance:
      global: 0.01
      red: 0.1
      green: 0.1
      blue: 0.1
      dark: 0.1
      bright: 0.1

  max text len: 42

  vocabulary:
    size: 700
    coverage:
      # https://www.unicode.org/emoji/charts/full-emoji-list.html
      # Fraction of each Unicode emoji subgroup that must be in the vocabulary.
      # Groups are the unicode.org/emoji/charts/emoji-list.html subgroups
      # (== emojibase messages.json subgroups); membership lives in data/group.json.

      # Smileys & Emotion
      face-smiling: 0.50
      face-affection: 0.4
      face-tongue: 0.35
      face-hand: 0.4
      face-neutral-skeptical: 0.3
      face-sleepy: 0.3
      face-unwell: 0.3
      face-hat: 0.3
      face-glasses: 0.3
      face-concerned: 0.2
      face-negative: 0.4
      face-costume: 0.4
      cat-face: 0.20
      monkey-face: 1.0
      heart: 0.2
      emotion: 0.45

      # People & Body  (hands used heavily; person-* long tail kept low)
      hand-fingers-open: 0.2
      hand-fingers-partial: 0.5
      hand-single-finger: 0.2
      hand-fingers-closed: 0.2
      hands: 1.0
      hand-prop: 0.3
      body-parts: 0.8
      person: 0.20
      person-gesture: 0.20
      person-role: 0.1
      person-fantasy: 0.1
      person-activity: 0.1
      person-sport: 0.1
      person-resting: 0.1
      family: 0.1
      person-symbol: 0.1

      # Component
      skin-tone: 0.0
      hair-style: 0.1

      # Animals & Nature
      animal-mammal: 0.5
      animal-bird: 0.5
      animal-amphibian: 1.0
      animal-reptile: 0.5
      animal-marine: 0.5
      animal-bug: 0.5
      plant-flower: 0.2
      plant-other: 0.2

      # Food & Drink
      food-fruit: 0.5
      food-vegetable: 0.5
      food-prepared: 0.5
      food-asian: 0.5
      food-marine: 0
      food-sweet: 0.5
      drink: 0.9
      dishware: 0.5

      # Travel & Places
      place-map: 0.1
      place-geographic: 0.5
      place-building: 0.5
      place-religious: 0.5
      place-other: 0.1
      transport-ground: 0.3
      transport-water: 0.5
      transport-air: 0.5
      hotel: 0.5
      time: 0.1
      sky-weather: 0.5

      # Activities
      event: 0.5
      award-medal: 0.5
      sport: 0.1
      game: 0.1
      arts-crafts: 0.1

      # Objects
      clothing: 0.1
      sound: 0.5
      music: 0.5
      musical-instrument: 0.5
      phone: 0.5
      computer: 0.5
      light-video: 0.5
      book-paper: 0.5
      money: 0.4
      mail: 0.2
      writing: 0.1
      office: 0.4
      lock: 0.1
      tool: 0.2
      science: 0.5
      medical: 0.5
      household: 0.5
      other-object: 0.2

      # Symbols
      transport-sign: 0.1
      warning: 0.1
      arrow: 0.1
      religion: 0.0
      zodiac: 1.0
      av-symbol: 0
      gender: 1.0
      math: 0.0
      punctuation: 0.5
      currency: 0
      other-symbol: 0.1
      keycap: 0.0
      alphanum: 0.0
      geometric: 0

      # Flags
      flag: 0.1
      country-flag: 0
      subdivision-flag: 0
